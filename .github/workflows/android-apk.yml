name: Build signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tools/verify_apk.py'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run regression tests and Android lint
        run: gradle --no-daemon -p android :app:testDebugUnitTest :app:lintDebug
      - name: Prepare signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          STORE="$RUNNER_TEMP/snapmaps-signing.p12"
          : "${ANDROID_KEYSTORE_BASE64:?Permanent signing key is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Keystore password is required}"
          : "${ANDROID_KEY_ALIAS:?Signing alias is required}"
          : "${ANDROID_KEY_PASSWORD:?Key password is required}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          chmod 600 "$STORE"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$STORE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
      - name: Build release APK
        run: gradle --no-daemon -p android :app:assembleRelease
      - name: Verify release contents and permanent signing identity
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/snap-to-maps-v1.3.apk
          python3 tools/verify_apk.py release/snap-to-maps-v1.3.apk --report release/verification.json
          sha256sum release/snap-to-maps-v1.3.apk > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: snap-maps-signed-apk
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 30

