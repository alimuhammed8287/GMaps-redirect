name: Build signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          STORE="$RUNNER_TEMP/snapmaps-signing.p12"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          else
            # One-run fallback keeps the build installable. Set the four repository secrets
            # above to keep the same signing identity across future releases.
            PASS="snapmaps-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "::add-mask::$PASS"
            keytool -genkeypair -noprompt -keystore "$STORE" -storetype PKCS12 \
              -storepass "$PASS" -keypass "$PASS" -alias snapmaps -keyalg RSA \
              -keysize 3072 -validity 10000 \
              -dname "CN=Snap to Maps, OU=Personal, O=Snap Maps, C=IN"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=snapmaps" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_PATH=$STORE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
      - name: Build release APK
        run: gradle --no-daemon -p android :app:assembleRelease
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: snap-maps-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

